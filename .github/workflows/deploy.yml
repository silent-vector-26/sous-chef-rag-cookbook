name: deploy
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Runs only after CI succeeded on a push to main (i.e. a merged PR), or manually.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_SEARCH_LOCATION: ${{ vars.AZURE_SEARCH_LOCATION }}
      AZURE_PRINCIPAL_ID: ${{ vars.AZURE_PRINCIPAL_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: Azure/setup-azd@v2

      - name: Log in with OIDC (no secrets)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider github \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Provision infrastructure
        run: azd provision --no-prompt

      - name: Deploy app
        run: azd deploy --no-prompt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-index recipes
        run: |
          eval "$(azd env get-values)"
          pip install -e ".[azure]"
          python -m ingest.build_dataset
          BACKEND=azure python -m ingest.index_azure

      - name: Smoke test
        run: |
          eval "$(azd env get-values)"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$APP_URL" || true)
            [ "$code" = "200" ] && echo "App is up" && exit 0
            sleep 20
          done
          echo "App did not return 200" && exit 1
